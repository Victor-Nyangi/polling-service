name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # No Supabase environment variables are set here, so the app builds in
      # demo mode. Every page is force-dynamic, so nothing is prerendered and
      # no page calls getSupabasePublicEnv() during the build.
      - run: npm run build
